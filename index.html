<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Race Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff5c8a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 8V4H8'/%3E%3Crect width='16' height='12' x='4' y='8' rx='2'/%3E%3Cpath d='M2 14h2M20 14h2M15 13v2M9 13v2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f; --paper:#f5f4f0; --card:#ffffff; --muted:#5b5b5b;
  --todo:#e9b949; --progress:#5b8def; --testing:#c26fd1; --done:#3fa877;
  --accent:#ff5c8a; --shadow:4px 4px 0 var(--ink); --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Space Grotesk",system-ui,sans-serif; color:var(--ink);
  background:#f5f4f0; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono",monospace}
.ic{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.17em;flex:none}
.btn .ic,.pill .ic{margin-right:4px}

/* header */
header{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 16px;border-bottom:3px solid var(--ink);
  background:#fff;
}
.logo{font-family:Bungee,sans-serif;font-size:26px;letter-spacing:1px;
  background:var(--card);padding:4px 12px;border:3px solid var(--ink);border-radius:10px;
  box-shadow:var(--shadow)}
.logo span{color:var(--accent)}
.spacer{flex:1}
.pill{background:var(--card);border:3px solid var(--ink);border-radius:999px;
  padding:6px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.pill.ok{background:#eaf6ef}.pill.warn{background:#faf3df}.pill.err{background:#fbe9e9}
.btn{background:var(--card);border:3px solid var(--ink);border-radius:10px;
  padding:7px 12px;font-weight:700;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:#ff6b6b;color:#fff}

main{padding:16px;max-width:1500px;margin:0 auto}

/* leaderboard */
.leader{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.player{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:12px 14px;position:relative;overflow:hidden}
.player::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--pc)}
.player .row{display:flex;align-items:center;gap:10px;margin-top:6px}
.avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:28px;
  background:#fff;color:var(--pc);border:3px solid var(--ink);flex:none}
.avatar .ic{stroke-width:2.4}
.pname{font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px}
.ptitle{font-size:12px;color:var(--muted);font-weight:500}
.rank{margin-left:auto;font-family:Bungee;font-size:20px;display:flex;align-items:center;gap:3px;color:var(--mc)}
.lvl{font-family:Bungee;font-size:12px;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px}
.xpbar{height:14px;border:2px solid var(--ink);border-radius:999px;background:#f1f1f1;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pc),var(--pc) 8px,#ffffff66 8px,#ffffff66 14px);transition:width .6s}
.xpline{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:28px}
.badge{font-size:18px;display:inline-grid;place-items:center;color:var(--bc);background:#f4f4f1;border:2px solid var(--ink);border-radius:8px;padding:1px 5px;cursor:help}
.badge.locked{filter:grayscale(1);opacity:.25}

/* epics */
.epics{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.epic{border:3px solid var(--ink);border-radius:12px;background:var(--card);padding:6px 10px;
  box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:5px;min-width:150px;text-align:left}
.epic .top{display:flex;align-items:center;gap:6px}
.epic .dot{width:12px;height:12px;border-radius:4px;background:var(--ec);border:2px solid var(--ink)}
.epic .pct{margin-left:auto;font-size:12px}
.epic .bar{height:7px;border-radius:999px;background:#eee;border:2px solid var(--ink);overflow:hidden}
.epic .bar i{display:block;height:100%;background:var(--ec)}
.epic.active{background:var(--ink);color:#fff;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.epic.active .bar{background:#ffffff33}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{border:3px solid var(--ink);border-top:8px solid var(--cc);border-radius:var(--r);background:#fbfbf9;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-height:420px}
.col h2{margin:0;padding:10px 12px;font-family:Bungee;font-size:17px;display:flex;align-items:center;gap:8px;
  border-bottom:2px solid #e4e2dc}
.col h2 .ic{color:var(--cc)}
.count{margin-left:auto;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:2px 9px;font-family:"Space Grotesk";font-weight:700}
.drop{flex:1;padding:10px;display:flex;flex-direction:column;gap:10px;transition:background .15s}
.drop.over{background:#efeee9;outline:3px dashed var(--ink);outline-offset:-8px;border-radius:10px}
.add{margin:0 10px 10px;border:2px dashed #b9b6ae;background:transparent;border-radius:10px;padding:8px;font-weight:700}

.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
  padding:10px 10px 8px 16px;position:relative;cursor:grab;transition:transform .1s}
.card:hover{transform:rotate(-.6deg) translateY(-2px)}
.card.dragging{opacity:.4}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--ec);border-radius:9px 0 0 9px;border-right:2px solid var(--ink)}
.card .tag{font-size:11px;font-weight:700;display:inline-flex;gap:4px;align-items:center;
  background:#fff;color:#333;border:2px solid #d9d6cf;border-radius:6px;padding:0 6px}
.card .tag .ic{color:var(--ec)}
.card .id{font-size:11px;color:var(--muted);margin-left:6px}
.card h3{margin:6px 0 4px;font-size:15px;line-height:1.25}
.card p{margin:0;font-size:12.5px;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:1px 8px 1px 5px;background:#fff;color:var(--ink)}
.who .ic{color:var(--pc);stroke-width:2.6}
.who.none{background:#eee;padding:0 7px;color:var(--muted)}
.stamp{color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:3px}
.moves{margin-left:auto;display:flex;gap:3px}
.moves button{border:2px solid var(--ink);background:#fff;border-radius:6px;width:24px;height:22px;font-size:13px;padding:0;line-height:1;display:grid;place-items:center}
.moves button:disabled{opacity:.25;cursor:default}

/* dialog */
dialog{border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);padding:0;width:min(520px,94vw);background:var(--card)}
dialog::backdrop{background:#14141466}
.dlg-h{padding:12px 16px;border-bottom:3px solid var(--ink);font-family:Bungee;font-size:18px;background:#f3f2ee}
.dlg-b{padding:14px 16px;display:grid;gap:10px}
.dlg-b label{font-weight:700;font-size:13px;display:grid;gap:4px}
.dlg-b input,.dlg-b select,.dlg-b textarea{border:3px solid var(--ink);border-radius:10px;padding:8px;background:#fffdf7;width:100%}
.dlg-b textarea{min-height:80px;resize:vertical}
.dlg-f{padding:12px 16px;border-top:3px solid var(--ink);display:flex;gap:8px;align-items:center}
.times{font-size:12px;color:var(--muted);display:grid;gap:2px}
.hint{font-size:12.5px;color:#333;line-height:1.45;margin:0}
.hint a{color:#3d7bff;font-weight:700}

/* toasts + confetti */
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50}
.toast{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;font-weight:700;max-width:340px;animation:pop .25s}
.toast.big{font-family:Bungee;font-size:18px}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

.readonly .card{cursor:pointer}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 4px;border:2px dashed #00000033;border-radius:10px}
@media (max-width:720px){.board{grid-template-columns:repeat(4,82vw)}.logo{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<header>
  <div class="logo">RACE<span>//</span>BOARD</div>
  <div class="spacer"></div>
  <span id="sync" class="pill warn">loading…</span>
  <button class="btn" id="refresh" title="Reload from GitHub" aria-label="Reload"></button>
  <button class="btn" id="settings">Token</button>
</header>

<main>
  <section class="leader" id="leader"></section>
  <section class="epics" id="epics"></section>
  <section class="board" id="board"></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="dlg-h" id="dlg-title">Ticket</div>
    <div class="dlg-b">
      <label>Title <input name="title" required maxlength="120"></label>
      <label>Description <textarea name="desc" maxlength="600"></textarea></label>
      <label>Epic <select name="epic" id="f-epic"></select></label>
      <label>Assigned to <select name="assignee" id="f-assignee"></select></label>
      <div class="times" id="f-times"></div>
    </div>
    <div class="dlg-f">
      <button class="btn danger" id="f-delete" type="button">Delete</button>
      <span class="spacer"></span>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="tokdlg">
  <form method="dialog">
    <div class="dlg-h">GitHub token</div>
    <div class="dlg-b">
      <p class="hint">Anyone can view the board. To move or edit tickets, paste a
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>
        with <b>Contents: read &amp; write</b> on <b>ANIRUK007/race-board</b> only.
        It is stored in this browser only and sent only to api.github.com.</p>
      <p class="hint" id="tok-why" style="font-weight:700"></p>
      <label>Token <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    </div>
    <div class="dlg-f">
      <button class="btn danger" id="tok-clear" type="button">Forget</button>
      <span class="spacer"></span>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" id="tok-save" value="save">Save</button>
    </div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
"use strict";

// Lucide icon paths (ISC licence), 24x24 stroke icons.
const ICONS = {
  bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  cpu:'<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>',
  plug:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  monitor:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  package:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
  clipboard:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  flask:'<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  left:'<path d="m15 18-6-6 6-6"/>',
  right:'<path d="m9 18 6-6-6-6"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  crown:'<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
};
const ic = (name, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.file}</svg>`;
const OWNER = "ANIRUK007", REPO = "race-board", FILE = "board.json", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

const COLS = [
  {id:"todo",     name:"TO-DO",       icon:"clipboard", c:"var(--todo)"},
  {id:"progress", name:"In Progress", icon:"play",      c:"var(--progress)"},
  {id:"testing",  name:"Testing",     icon:"flask",     c:"var(--testing)"},
  {id:"done",     name:"Done",        icon:"trophy",    c:"var(--done)"},
];
const XP = {todo:0, progress:15, testing:40, done:100};
const TITLES = ["Kernel Panic Intern","Segfault Survivor","Bash Bard","Systemd Whisperer",
  "Pacman Overlord","Wayland Wizard","Root of All Roots","Arch-Mage","Legendary Daemon"];
const BADGES = [
  {id:"first",  icon:"target", c:"#ef4444", name:"First Blood",  hint:"Finish your first ticket"},
  {id:"hat",    icon:"award",  c:"#8b5cf6", name:"Hat Trick",    hint:"Finish 3 tickets"},
  {id:"speed",  icon:"zap",    c:"#eab308", name:"Speedrunner",  hint:"Finish a ticket within 2h of committing"},
  {id:"owl",    icon:"moon",   c:"#3d7bff", name:"Night Owl",    hint:"Finish a ticket between midnight and 5am"},
  {id:"lab",    icon:"flask",  c:"#ec4899", name:"Lab Rat",      hint:"Have 2+ tickets in Testing at once"},
  {id:"slayer", icon:"crown",  c:"#ff8a00", name:"Epic Slayer",  hint:"Close the last ticket of an epic"},
  {id:"streak", icon:"flame",  c:"#f97316", name:"On Fire",      hint:"3-day completion streak"},
];

let state = null, sha = null, etag = null, filter = null, editing = null, pending = null;
const $ = s => document.querySelector(s);
const token = () => { try { return localStorage.getItem("rb_token") || ""; } catch { return ""; } };

// --- safe rendering: ticket text comes from a shared file, never trust it ---
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeColor = c => /^#[0-9a-fA-F]{3,8}$/.test(c || "") ? c : "#999999";

// --- utf-8 safe base64 ---
function b64decode(s) {
  const bin = atob(s.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function headers() {
  const h = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"};
  if (token()) h.Authorization = `Bearer ${token()}`;
  return h;
}

function setSync(text, kind) { const el = $("#sync"); el.textContent = text; el.className = `pill ${kind}`; }

async function load(silent) {
  const h = headers(); if (etag && silent) h["If-None-Match"] = etag;
  const r = await fetch(`${API}?ref=${BRANCH}`, {headers: h, cache: "no-store"});
  if (r.status === 304) return false;
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  etag = r.headers.get("ETag");
  sha = j.sha;
  state = JSON.parse(b64decode(j.content));
  render();
  setSync(token() ? "synced" : "view only", token() ? "ok" : "warn");
  return true;
}

// Apply an operation and commit it. On a conflict (someone else saved first)
// refetch and re-apply the same operation, so moves never overwrite each other.
async function commit(op, message) {
  if (!token()) {
    pending = {op, message};
    $("#tok").value = ""; $("#tok-why").textContent = "Add your token to save this change. It will be applied right after.";
    $("#tokdlg").showModal(); return false;
  }
  const before = levels();
  op(state); render();
  setSync("saving…", "warn");
  for (let attempt = 0; attempt < 3; attempt++) {
    const body = JSON.stringify({message, branch: BRANCH, sha,
      content: b64encode(JSON.stringify(state, null, 2) + "\n")});
    const r = await fetch(API, {method: "PUT", headers: {...headers(), "Content-Type": "application/json"}, body});
    if (r.ok) {
      const j = await r.json(); sha = j.content.sha; etag = null;
      setSync("synced", "ok"); celebrateLevels(before); return true;
    }
    if (r.status === 409 || r.status === 422) {            // stale sha
      await load(false); op(state); render(); continue;
    }
    setSync("save failed", "err");
    toast(r.status === 401 || r.status === 403 ? "Token rejected — check its permissions" : `Save failed (${r.status})`);
    await load(false); return false;
  }
  setSync("conflict", "err"); toast("Couldn't save — board busy, try again"); await load(false); return false;
}

// --- gamification (all derived from tickets, nothing extra stored) ---
const dayKey = iso => new Date(iso).toISOString().slice(0, 10);
function stats() {
  const out = {};
  for (const u of state.users) out[u.id] = {xp: 0, done: 0, badges: new Set(), days: new Set(), testing: 0};
  for (const t of state.tickets) {
    const s = out[t.assignee]; if (!s) continue;
    s.xp += XP[t.status] || 0;
    if (t.status === "testing") s.testing++;
    if (t.status === "done" && t.completedAt) {
      s.done++; s.days.add(dayKey(t.completedAt));
      const fast = t.committedAt && (new Date(t.completedAt) - new Date(t.committedAt)) < 2 * 3600e3;
      if (fast) { s.xp += 30; s.badges.add("speed"); }
      const hr = new Date(t.completedAt).getHours(); if (hr < 5) s.badges.add("owl");
    }
  }
  // Epic Slayer: completed the most recently finished ticket of a fully done epic
  for (const e of state.epics) {
    const ts = state.tickets.filter(t => t.epic === e.id);
    if (ts.length && ts.every(t => t.status === "done")) {
      const last = ts.reduce((a, b) => (a.completedAt || "") > (b.completedAt || "") ? a : b);
      if (out[last.assignee]) { out[last.assignee].badges.add("slayer"); out[last.assignee].xp += 150; }
    }
  }
  for (const s of Object.values(out)) {
    if (s.done >= 1) s.badges.add("first");
    if (s.done >= 3) s.badges.add("hat");
    if (s.testing >= 2) s.badges.add("lab");
    s.streak = streak(s.days); if (s.streak >= 3) s.badges.add("streak");
    const L = levelOf(s.xp); Object.assign(s, L);
  }
  return out;
}
function streak(days) {
  let d = new Date(); d.setUTCHours(0, 0, 0, 0);
  if (!days.has(d.toISOString().slice(0, 10))) d.setUTCDate(d.getUTCDate() - 1);
  let n = 0; while (days.has(d.toISOString().slice(0, 10))) { n++; d.setUTCDate(d.getUTCDate() - 1); }
  return n;
}
// level L needs 50*L*(L-1) xp: 0, 100, 300, 600, 1000, ...
function levelOf(xp) {
  let L = 1; while (xp >= 50 * (L + 1) * L) L++;
  const lo = 50 * L * (L - 1), hi = 50 * (L + 1) * L;
  return {level: L, title: TITLES[Math.min(L - 1, TITLES.length - 1)], pct: Math.round(100 * (xp - lo) / (hi - lo)), next: hi};
}
const levels = () => { const s = stats(); return Object.fromEntries(Object.entries(s).map(([k, v]) => [k, v.level])); };
function celebrateLevels(before) {
  const now = stats();
  for (const u of state.users) if (now[u.id].level > (before[u.id] || 1)) {
    toast(`${u.name} hit LEVEL ${now[u.id].level} — ${now[u.id].title}!`, true); confetti(160);
  }
}

// --- rendering ---
function render() {
  document.body.classList.toggle("readonly", !token());
  renderLeader(); renderEpics(); renderBoard();
}
function userOf(id) { return state.users.find(u => u.id === id); }
function epicOf(id) { return state.epics.find(e => e.id === id) || {title: "?", icon: "file", color: "#999"}; }

function renderLeader() {
  const s = stats();
  const ranked = [...state.users].sort((a, b) => s[b.id].xp - s[a.id].xp);
  const medal = ["#f5b301", "#9aa4b2", "#c8763a"];
  $("#leader").innerHTML = ranked.map((u, i) => {
    const st = s[u.id];
    const badges = BADGES.map(b => `<span class="badge ${st.badges.has(b.id) ? "" : "locked"}" style="--bc:${b.c}" title="${esc(b.name)} — ${esc(b.hint)}">${ic(b.icon)}</span>`).join("");
    return `<div class="player" style="--pc:${safeColor(u.color)}">
      <div class="row">
        <div class="avatar">${ic("bot")}</div>
        <div><div class="pname">${esc(u.name)} <span class="lvl">LV ${st.level}</span></div>
             <div class="ptitle">${esc(st.title)} · ${ic("flame")} ${st.streak}-day streak · ${ic("check")} ${st.done} done</div></div>
        <div class="rank" style="--mc:${medal[i]}">${ic("trophy")}#${i + 1}</div>
      </div>
      <div class="xpbar"><i style="width:${st.pct}%"></i></div>
      <div class="xpline mono"><span>${st.xp} XP</span><span>${st.next} XP → LV ${st.level + 1}</span></div>
      <div class="badges">${badges}</div>
    </div>`;
  }).join("");
}

function renderEpics() {
  const chips = state.epics.map(e => {
    const ts = state.tickets.filter(t => t.epic === e.id);
    const pct = ts.length ? Math.round(100 * ts.filter(t => t.status === "done").length / ts.length) : 0;
    return `<button class="epic ${filter === e.id ? "active" : ""}" data-epic="${esc(e.id)}" style="--ec:${safeColor(e.color)}">
      <span class="top"><span class="dot"></span>${ic(e.icon)} ${esc(e.title)}<span class="pct mono">${pct}%</span></span>
      <span class="bar"><i style="width:${pct}%"></i></span></button>`;
  }).join("");
  $("#epics").innerHTML = `<button class="btn ${filter ? "" : "primary"}" data-epic="">All epics</button>${chips}`;
}

const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${Math.max(m, 0)}m ago`;
  if (m < 1440) return `${Math.round(m / 60)}h ago`;
  return new Date(iso).toLocaleDateString(undefined, {month: "short", day: "numeric"});
};

function renderBoard() {
  const vis = state.tickets.filter(t => !filter || t.epic === filter);
  $("#board").innerHTML = COLS.map((c, ci) => {
    const ts = vis.filter(t => t.status === c.id);
    const cards = ts.map(t => {
      const e = epicOf(t.epic), u = userOf(t.assignee);
      const who = u ? `<span class="who" style="--pc:${safeColor(u.color)}">${ic("bot")} ${esc(u.name)}</span>`
                    : `<span class="who none">unassigned</span>`;
      const stamp = t.completedAt ? `${ic("check")} ${ago(t.completedAt)}` : t.committedAt ? `${ic("clock")} ${ago(t.committedAt)}` : "";
      return `<article class="card" draggable="true" data-id="${esc(t.id)}" style="--ec:${safeColor(e.color)}">
        <span class="tag">${ic(e.icon)} ${esc(e.title)}</span><span class="id mono">${esc(t.id)}</span>
        <h3>${esc(t.title)}</h3>${t.desc ? `<p>${esc(t.desc)}</p>` : ""}
        <div class="foot">${who}<span class="stamp">${stamp}</span>
          <span class="moves"><button data-move="-1" ${ci === 0 ? "disabled" : ""} aria-label="Move left">${ic("left")}</button><button data-move="1" ${ci === COLS.length - 1 ? "disabled" : ""} aria-label="Move right">${ic("right")}</button></span>
        </div></article>`;
    }).join("") || `<div class="empty">${c.id === "done" ? "Nothing shipped yet. Go win." : "Empty — drop a ticket here"}</div>`;
    return `<section class="col" style="--cc:${c.c}">
      <h2>${ic(c.icon)} ${c.name}<span class="count">${ts.length}</span></h2>
      <div class="drop" data-col="${c.id}">${cards}</div>
      ${c.id === "todo" ? `<button class="add" id="add">${ic("plus")} New ticket</button>` : ""}
    </section>`;
  }).join("");
}

// --- moving tickets (timestamps follow the column) ---
function moveTo(id, status) {
  const t = state.tickets.find(x => x.id === id);
  if (!t || t.status === status) return;
  const from = t.status;
  const u = userOf(t.assignee);
  commit(s => {
    const x = s.tickets.find(y => y.id === id); if (!x) return;
    x.status = status;
    if (status === "todo") { x.committedAt = null; x.completedAt = null; }
    else if (!x.committedAt) x.committedAt = new Date().toISOString();
    x.completedAt = status === "done" ? (x.completedAt || new Date().toISOString()) : null;
  }, `board: ${id} ${from} → ${status}${u ? ` (${u.name})` : ""}`).then(ok => {
    if (ok && status === "done") { confetti(); toast(`${id} shipped! +${XP.done} XP${u ? ` for ${u.name}` : ""}`); }
  });
}

// --- events ---
document.addEventListener("click", e => {
  const ep = e.target.closest("[data-epic]");
  if (ep) { filter = ep.dataset.epic || null; render(); return; }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const id = mv.closest(".card").dataset.id, t = state.tickets.find(x => x.id === id);
    const i = COLS.findIndex(c => c.id === t.status) + Number(mv.dataset.move);
    if (COLS[i]) moveTo(id, COLS[i].id); return;
  }
  if (e.target.closest("#add")) { openTicket(null); return; }
  const card = e.target.closest(".card");
  if (card) openTicket(card.dataset.id);
});

let dragId = null;
document.addEventListener("dragstart", e => {
  const c = e.target.closest(".card"); if (!c) return;
  dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragend", e => { e.target.closest?.(".card")?.classList.remove("dragging"); });
document.addEventListener("dragover", e => {
  const d = e.target.closest(".drop"); if (!d || !dragId) return;
  e.preventDefault(); document.querySelectorAll(".drop.over").forEach(x => x !== d && x.classList.remove("over")); d.classList.add("over");
});
document.addEventListener("dragleave", e => { const d = e.target.closest(".drop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest(".drop"); if (!d || !dragId) return;
  e.preventDefault(); d.classList.remove("over"); moveTo(dragId, d.dataset.col); dragId = null;
});

// --- ticket dialog ---
function openTicket(id) {
  editing = id;
  const t = id ? state.tickets.find(x => x.id === id) : {title: "", desc: "", epic: filter || state.epics[0].id, assignee: null};
  const f = $("#form");
  $("#dlg-title").textContent = id ? `Edit ${id}` : "New ticket";
  $("#f-epic").innerHTML = state.epics.map(e => `<option value="${esc(e.id)}">${esc(e.title)}</option>`).join("");
  $("#f-assignee").innerHTML = `<option value="">— unassigned —</option>` +
    state.users.map(u => `<option value="${esc(u.id)}">${esc(u.name)}</option>`).join("");
  f.title.value = t.title; f.desc.value = t.desc || ""; f.epic.value = t.epic; f.assignee.value = t.assignee || "";
  const fmt = iso => iso ? new Date(iso).toLocaleString() : "—";
  $("#f-times").innerHTML = id ? `<span>${ic("clock")} Committed: <b>${esc(fmt(t.committedAt))}</b></span><span>${ic("check")} Completed: <b>${esc(fmt(t.completedAt))}</b></span>` : "";
  $("#f-delete").style.display = id ? "" : "none";
  $("#dlg").showModal();
}
$("#dlg").addEventListener("close", () => {
  if ($("#dlg").returnValue !== "save") return;
  const f = $("#form"), v = {title: f.title.value.trim(), desc: f.desc.value.trim(), epic: f.epic.value, assignee: f.assignee.value || null};
  if (!v.title) return;
  if (editing) {
    const id = editing;
    commit(s => Object.assign(s.tickets.find(t => t.id === id), v), `board: edit ${id}`);
  } else {
    commit(s => {
      const n = Math.max(0, ...s.tickets.map(t => Number(String(t.id).split("-")[1]) || 0)) + 1;
      s.tickets.push({id: `T-${n}`, ...v, status: "todo", committedAt: null, completedAt: null});
    }, `board: new ticket "${v.title}"`);
  }
});
$("#f-delete").addEventListener("click", () => {
  const id = editing; if (!id || !confirm(`Delete ${id}? This can't be undone from the board.`)) return;
  $("#dlg").close(); commit(s => { s.tickets = s.tickets.filter(t => t.id !== id); }, `board: delete ${id}`);
});

// --- token dialog ---
$("#settings").addEventListener("click", () => { $("#tok").value = ""; $("#tok-why").textContent = ""; $("#tokdlg").showModal(); });
$("#tokdlg").addEventListener("close", () => {
  const p = pending; pending = null;
  if ($("#tokdlg").returnValue !== "save") return;
  const v = $("#tok").value.trim(); if (!v) return;
  try { localStorage.setItem("rb_token", v); } catch {}
  toast("Token saved");
  load(false).then(() => p && commit(p.op, p.message)).catch(err => toast(err.message));
});
$("#tok-clear").addEventListener("click", () => {
  try { localStorage.removeItem("rb_token"); } catch {}
  $("#tokdlg").close(); toast("Token forgotten"); load(false).catch(() => {});
});
$("#refresh").addEventListener("click", () => load(false).catch(err => { setSync("offline", "err"); toast(err.message); }));

// --- toasts + confetti ---
function toast(msg, big) {
  const el = document.createElement("div"); el.className = `toast${big ? " big" : ""}`; el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), big ? 4200 : 2800);
}
function confetti(n = 110) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ff5c8a", "#ff8a00", "#ffd23f", "#3dd6a3", "#3d7bff", "#8b5cf6"];
  const ps = Array.from({length: n}, () => ({x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 16,
    vy: Math.random() * -14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, life: 0}));
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height); let alive = 0;
    for (const p of ps) {
      p.life++; p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; if (p.y < cv.height + 20) alive++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore();
    }
    if (alive) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

$("#refresh").innerHTML = ic("refresh");
$("#settings").innerHTML = ic("key") + "Token";

// --- boot: initial load, then light polling so teammates' moves appear ---
load(false).catch(err => { setSync("offline", "err"); toast(`Couldn't load board: ${err.message}`); });
// ponytail: polling, not push. Unauthenticated API allows 60 req/h, so viewers
// poll slowly; ETag 304s don't count against the limit when authenticated.
setInterval(() => { if (!document.hidden && !$("#dlg").open) load(true).catch(() => {}); }, token() ? 30000 : 120000);
</script>
</body>
